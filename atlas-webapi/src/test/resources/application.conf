//        class = "com.netflix.atlas.webapi.GraphRequestActor"
//      },
      {
        name = "db"
        class = "com.netflix.atlas.webapi.TraceDB"
      }
    ]
  }
}

atlas.eval.graph.vocabulary = "com.netflix.atlas.webapi.TVoc"